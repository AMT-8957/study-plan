<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دفترچه برنامه مطالعه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&family=Lalezar&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1f2937;--mut:#6b7280;--f-title:'Lalezar','Vazirmatn',Tahoma,sans-serif;--f-body:'Vazirmatn',Tahoma,sans-serif;--f-note:'Noto Naskh Arabic','Vazirmatn',serif;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--card:#1b2127;--ink:#e5e7eb;--mut:#9ca3af;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161b;--card:#1b2127;--ink:#e5e7eb;--mut:#9ca3af;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);min-height:100vh}
.wrap{max-width:1240px;margin:0 auto;padding:12px 14px 40px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.tab{border:1.5px solid var(--tc);background:var(--card);color:var(--ink);font:600 .88rem var(--f-body);padding:7px 13px;border-radius:99px;cursor:pointer}
.tab.on{background:var(--tc);color:#fff}
.stat{margin-inline-start:auto;font-size:.78rem;color:var(--mut)}
.view{display:none;--t:color-mix(in srgb,var(--c) 8%,var(--card));--t2:color-mix(in srgb,var(--c) 22%,var(--card));--d:color-mix(in srgb,var(--c) 80%,black)}
.view.on{display:block}
.hdr{border-radius:16px;color:#fff;padding:16px 22px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;margin-bottom:12px;
 background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='30' height='30'><g fill='none' stroke='white' stroke-opacity='.22'><rect x='8' y='8' width='14' height='14'/><rect x='8' y='8' width='14' height='14' transform='rotate(45 15 15)'/></g></svg>"),linear-gradient(100deg,var(--d),var(--c))}
.hdr h1{font:400 1.9rem/1.2 var(--f-title)}
.hdr p{font:500 .9rem var(--f-note);opacity:.92}
.fl{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem}
.fl label{display:flex;align-items:center;gap:6px}
.fl input{background:transparent;border:0;border-bottom:1.5px dashed rgba(255,255,255,.85);color:#fff;font:inherit;width:150px;padding:2px 4px;outline:0}
.fl input:focus{border-bottom-style:solid}
.hdr.rep{background:repeating-linear-gradient(135deg,rgba(255,255,255,.13) 0 10px,transparent 10px 24px),linear-gradient(100deg,var(--d),var(--c))}
.tab.grp{--tc:var(--ink);font-weight:800}.tab.grp.on{background:var(--ink);color:var(--bg)}.dv{width:1px;height:22px;background:var(--mut);opacity:.4;margin:0 6px}
.sc{overflow-x:auto;border:1.5px solid var(--c);border-radius:14px;background:var(--card)}
table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:820px}
th{background:var(--d);color:#fff;font:700 .82rem var(--f-body);padding:10px 4px;border-inline-start:1px solid rgba(255,255,255,.3);line-height:1.35}
td{border-top:1px solid var(--t2);border-inline-start:1px solid var(--t2);height:56px;padding:0}
tbody tr:nth-child(even) td{background:var(--t)}
td textarea,.fl2 textarea{display:block;width:100%;height:100%;min-height:54px;border:0;background:transparent;color:var(--ink);font:400 .92rem/1.5 var(--f-body);padding:8px 8px;resize:none;text-align:center;outline:0}
td.l textarea{text-align:start}
td textarea:focus,.ln:focus,.nt:focus{background:var(--card);box-shadow:inset 0 0 0 2px var(--c)}
td.no{text-align:center;font:800 .95rem var(--f-body);color:var(--d);background:var(--t2)!important}
tr.tot td{background:var(--t2)!important;border-top:2px solid var(--c);height:48px}
tr.tot td.lb{font:700 .88rem var(--f-body);color:var(--d);padding:0 14px}
.dy{color:#fff;font:700 .88rem var(--f-body);text-align:center;background:var(--dc)!important}
.lab{font:700 1.05rem var(--f-note);color:var(--d);margin:16px 4px 4px;display:flex;gap:10px;align-items:center}
.lab::after{content:"";flex:1;height:1px;background:var(--t2)}
.nt{display:block;width:100%;height:100px;border:1.5px dashed var(--c);border-radius:12px;background:var(--t);color:var(--ink);font:400 .95rem/1.7 var(--f-body);padding:10px 14px;resize:vertical;outline:0}
.ln{display:block;width:100%;height:46px;border:0;border-bottom:1.5px solid var(--c);background:transparent;color:var(--ink);font:400 .95rem var(--f-body);padding:6px 10px;outline:0}
.ln{font-size:16px!important}.ln:last-child{margin-bottom:45vh}
.wht .hdr,.wht .hdr.rep{background:var(--card);color:var(--ink);border:1.5px solid var(--t2)}.wht .fl input{color:var(--ink);border-bottom-color:var(--mut)}.wht th{background:var(--t2);color:var(--ink);border-inline-start-color:rgba(128,128,128,.25)}.tab.wt.on{background:var(--card);color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
 <nav class="bar" id="bar"></nav>
 <main id="views"></main>
</div>
<script>
const DAYS=[["sat","شنبه","#0f766e"],["sun","یکشنبه","#b45309"],["mon","دوشنبه","#1d4ed8"],["tue","سه‌شنبه","#be185d"],["wed","چهارشنبه","#6d28d9"],["thu","پنجشنبه","#15803d"],["fri","جمعه","#b91c1c"]];
const SUBJ=[["زیست","#15803d"],["شیمی","#c2410c"],["فیزیک","#1d4ed8"],["ریاضی","#6d28d9"],["زمین","#a16207"],["ادبیات","#be185d"],["زبان","#0e7490"],["عربی","#4d7c0f"],["دینی","#0f766e"],["سلامت و بهداشت","#b91c1c"],["هویت اجتماعی","#475569"]];
const FA="۰۱۲۳۴۵۶۷۸۹",fa=n=>String(n).replace(/\d/g,d=>FA[d]);
const LS="studyplan-v1",state={};
try{Object.assign(state,JSON.parse(localStorage.getItem(LS)||"{}"))}catch(e){}
/* ===== تنظیم: آدرس پایگاه‌داده‌ی Firebase خودت را بین گیومه‌ها بگذار ===== */
const DB_URL="PASTE_YOUR_DATABASE_URL_HERE";
/* ======================================================================= */
const BASE=DB_URL.replace(/\/+$/,"")+"/plan.json";
let ref=/^https:\/\//.test(DB_URL),dirty={},writing=false,timer=null,seeded=false;
const statEl=document.createElement("span");statEl.className="stat";
const setStat=t=>statEl.textContent=t;

function persistLocal(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
function save(k,v){state[k]=v;persistLocal();if(!ref){setStat("ذخیره روی همین دستگاه");return}
 dirty[k]=v;setStat("در حال ذخیره…");clearTimeout(timer);timer=setTimeout(flush,700)}
async function flush(){
 if(writing||!Object.keys(dirty).length)return;
 const batch=dirty;dirty={};writing=true;timer=null;
 try{const r=await fetch(BASE,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(batch)});
  if(!r.ok)throw new Error(r.status);
  if(!Object.keys(dirty).length)setStat("✓ ذخیره شد")}
 catch(e){dirty=Object.assign({},batch,dirty);setStat("خطا در ذخیره؛ دوباره تلاش می‌شود");clearTimeout(timer);timer=setTimeout(flush,4000)}
 writing=false;if(Object.keys(dirty).length&&!timer)flush()}

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ta=(k,cls)=>`<textarea data-k="${k}" ${cls||""}>${esc(state[k])}</textarea>`;
const inp=(k,ph)=>`<label>${ph}<input data-k="${k}" value="${esc(state[k])}"></label>`;

function daily(i){const[id,name,c]=DAYS[i];
 const H=[["ردیف",5],["نام درس",15],["مبحث و سرفصل مطالعه",34],["مدت مطالعه مطلوب",12],["تعداد تست",9],["ارزیابی / توضیحات",25]];
 let rows="";for(let r=1;r<=8;r++){rows+=`<tr><td class="no">${fa(r)}</td>`+[0,1,3,4,5].map(x=>`<td class="${x==1?"l":""}">${ta(`d${i}_${r}_${x}`)}</td>`).join("")+"</tr>"}
 rows+=`<tr class="tot"><td colspan="3" class="lb">جمع کل برنامه مطالعه ${name}:</td>`+[0,1,2].map(x=>`<td>${ta(`d${i}_tot_${x}`)}</td>`).join("")+"</tr>";
 return`<section class="view" id="v-${id}" style="--c:${c}"><div class="hdr"><div><h1>برنامه مطالعه روزانه — ${name}</h1><p>هر روز، یک قدم نزدیک‌تر به هدف</p></div><div class="fl">${inp(`d${i}_date`,"تاریخ:")}${inp(`d${i}_week`,"هفته:")}</div></div>
 <div class="sc"><table><thead><tr>${H.map(h=>`<th style="width:${h[1]}%">${h[0]}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
 <div class="lab">یادداشت و اهداف روزانه:</div><textarea class="nt" data-k="d${i}_notes">${esc(state[`d${i}_notes`])}</textarea></section>`}

function weekly(){
 const th=`<th style="width:9%">روز</th>`+SUBJ.map(s=>`<th style="box-shadow:inset 0 4px 0 ${s[1]}">${s[0]}</th>`).join("")+`<th style="width:7%">جمع روز</th>`;
 let rows="";DAYS.forEach((d,i)=>{rows+=`<tr><td class="dy" style="--dc:${d[2]}">${d[1]}</td>`+Array.from({length:12},(_,s)=>`<td>${ta(`w_${i}_${s}`)}</td>`).join("")+"</tr>"});
 rows+=`<tr class="tot"><td class="lb">جمع هفته</td>`+Array.from({length:12},(_,s)=>`<td>${ta(`w_tot_${s}`)}</td>`).join("")+"</tr>";
 return`<section class="view" id="v-week" style="--c:#0f4c5c"><div class="hdr"><div><h1>برنامه جامع هفتگی مطالعه</h1><p>نقشه‌ی راه هفته‌ی تو در یک نگاه</p></div><div class="fl">${inp("w_name","نام و نام خانوادگی:")}${inp("w_from","از تاریخ:")}${inp("w_to","تا تاریخ:")}${inp("w_week","هفته:")}</div></div>
 <div class="sc"><table style="min-width:980px"><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table></div>
 <div class="lab">تحلیل و برنامه‌ریزی کلی هفته / اهداف کلان:</div>${[0,1,2].map(n=>`<input class="ln" data-k="w_ln${n}" value="${esc(state[`w_ln${n}`])}">`).join("")}</section>`}

function dailyRep(i){const[id,name,c]=DAYS[i];
 const H=[["ردیف",5],["درس",15],["تست",10],["ساعت مفید",11],["ساعت کلی",11],["مدت ویدیو",11],["مرور",11],["مطالعه جزوه/کتاب",26]];
 let rows="";for(let r=1;r<=8;r++){rows+=`<tr><td class="no">${fa(r)}</td>`+[0,1,2,3,4,5,6].map(x=>`<td class="${x==0?"l":""}">${ta(`r${i}_${r}_${x}`)}</td>`).join("")+"</tr>"}
 rows+=`<tr class="tot"><td colspan="2" class="lb">جمع کل گزارش کار ${name}:</td>`+[0,1,2,3,4,5].map(x=>`<td>${ta(`r${i}_tot_${x}`)}</td>`).join("")+"</tr>";
 return`<section class="view" id="v-r-${id}" style="--c:${c}"><div class="hdr rep"><div><h1>گزارش کار روزانه — ${name}</h1><p>آنچه امروز انجام دادی را صادقانه ثبت کن</p></div><div class="fl">${inp(`r${i}_date`,"تاریخ:")}${inp(`r${i}_week`,"هفته:")}</div></div>
 <div class="sc"><table><thead><tr>${H.map(h=>`<th style="width:${h[1]}%">${h[0]}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
 <div class="lab">یادداشت و نکات ارزیابی روزانه:</div><textarea class="nt" data-k="r${i}_notes">${esc(state[`r${i}_notes`])}</textarea></section>`}
function weeklyRep(){
 const th=`<th style="width:9%">روز</th>`+SUBJ.map(s=>`<th style="box-shadow:inset 0 4px 0 ${s[1]}">${s[0]}</th>`).join("")+`<th style="width:7%">جمع روز</th>`;
 let rows="";DAYS.forEach((d,i)=>{rows+=`<tr><td class="dy" style="--dc:${d[2]}">${d[1]}</td>`+Array.from({length:12},(_,s)=>`<td>${ta(`rw_${i}_${s}`)}</td>`).join("")+"</tr>"});
 rows+=`<tr class="tot"><td class="lb">جمع هفته</td>`+Array.from({length:12},(_,s)=>`<td>${ta(`rw_tot_${s}`)}</td>`).join("")+"</tr>";
 return`<section class="view wht" id="v-r-week" style="--c:#64748b"><div class="hdr rep"><div><h1>گزارش کار جامع هفتگی عملکرد</h1><p>آیینه‌ی عملکرد هفته‌ی تو</p></div><div class="fl">${inp("rw_name","نام و نام خانوادگی:")}${inp("rw_from","از تاریخ:")}${inp("rw_to","تا تاریخ:")}${inp("rw_week","هفته:")}</div></div>
 <div class="sc"><table style="min-width:980px"><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table></div>
 <div class="lab">تحلیل عملکرد کل هفته / بازبینی و اصلاحات هفته آتی:</div>${[0,1,2].map(n=>`<input class="ln" data-k="rw_ln${n}" value="${esc(state[`rw_ln${n}`])}">`).join("")}</section>`}
document.getElementById("views").innerHTML=DAYS.map((_,i)=>daily(i)).join("")+weekly()+DAYS.map((_,i)=>dailyRep(i)).join("")+weeklyRep();
const tabs=[...DAYS.map(d=>[d[0],d[1],d[2]]),["week","جامع هفتگی","#0f4c5c"],...DAYS.map(d=>["r-"+d[0],d[1],d[2]]),["r-week","جامع هفتگی","#64748b"]];
const bar=document.getElementById("bar");
bar.innerHTML=`<button class="tab grp" data-g="p" data-id="sat">📘 برنامه</button><button class="tab grp" data-g="r" data-id="r-sat">📝 گزارش</button><i class="dv"></i>`+tabs.map(t=>`<button class="tab day${t[0]=="r-week"?" wt":""}" data-g="${t[0].startsWith("r-")?"r":"p"}" data-id="${t[0]}" style="--tc:${t[2]}">${t[1]}</button>`).join("");bar.appendChild(statEl);
function show(){let id=(location.hash||"").slice(1);if(!tabs.some(t=>t[0]==id))id="sat";
 document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id=="v-"+id));
 const g=id.startsWith("r-")?"r":"p";
 bar.querySelectorAll(".tab").forEach(b=>{if(b.classList.contains("grp")){b.classList.toggle("on",b.dataset.g==g)}else{b.hidden=b.dataset.g!=g;b.classList.toggle("on",b.dataset.id==id)}})}
bar.addEventListener("click",e=>{const b=e.target.closest(".tab");if(b){location.hash=b.dataset.id}});
addEventListener("hashchange",show);show();
document.getElementById("views").addEventListener("input",e=>{const k=e.target.dataset.k;if(k)save(k,e.target.value)});
setStat(ref?"در حال اتصال…":"آدرس پایگاه‌داده تنظیم نشده؛ ذخیره روی همین دستگاه");

document.getElementById("views").addEventListener("focusin",e=>{if(e.target.classList.contains("ln"))setTimeout(()=>e.target.scrollIntoView({block:"center",behavior:"smooth"}),300)});
function applyRemote(data){let ch=false;
 for(const k in data){if(k in dirty||state[k]===data[k])continue;state[k]=data[k];ch=true;
  const el=document.querySelector(`[data-k="${k}"]`);if(el&&el!==document.activeElement)el.value=data[k]}
 if(ch)persistLocal()}

async function pull(){
 if(!ref||writing||Object.keys(dirty).length)return;
 try{const r=await fetch(BASE,{cache:"no-store"});if(!r.ok)throw new Error(r.status);
  const d=await r.json();
  if(d){applyRemote(d);seeded=true}
  else if(!seeded&&Object.keys(state).length){seeded=true;dirty=Object.assign({},state);flush();return}
  if(!Object.keys(dirty).length)setStat("✓ همگام")}
 catch(e){setStat("اتصال برقرار نیست؛ دوباره تلاش می‌شود")}}
if(ref){pull();setInterval(pull,4000)}
</script>
</body>
</html>
